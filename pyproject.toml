[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-mailsec"
version = "0.4.0a8"
description = "Self-hosted Gmail security with bounded attachment inspection and hosted or local decision models"
authors = [{name = "Derrik Trace"}]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[c]>=3.2,<4", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1", "python-dotenv>=1.0,<2", "PyYAML>=6,<7",
  "tldextract>=5.1,<6", "google-auth[requests]>=2.38,<3",
  "cryptography>=46,<51", "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
inspection = ["pypdf>=6,<7", "Pillow>=13,<14", "zxing-cpp>=2.3,<4", "defusedxml>=0.7,<1", "oletools>=0.60,<1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
mailsec = "mailsec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mailsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: paid TypeSafe integration (explicit opt in)"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
